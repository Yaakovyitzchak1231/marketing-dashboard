name: tmp-key-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Anthropic key (status only, never the key)
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "key length: ${#KEY}"
          echo "key prefix: ${KEY:0:8}"
          echo "--- models endpoint ---"
          curl -s -o /tmp/body.txt -w "HTTP %{http_code}\n" \
            https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" \
            -H "anthropic-version: 2023-06-01"
          echo "--- response ---"
          head -c 600 /tmp/body.txt
          echo
          echo "--- messages endpoint (tiny call) ---"
          curl -s -o /tmp/msg.txt -w "HTTP %{http_code}\n" \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-opus-5-5","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}'
          echo "--- response ---"
          head -c 600 /tmp/msg.txt
