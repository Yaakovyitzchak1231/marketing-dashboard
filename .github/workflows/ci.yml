name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Links, npm scripts, backticked paths and the architecture map must match the repo.
      - name: Docs check
        run: npm run docs:check

      - name: Test
        run: npm test

      # No secrets are given to CI: the build must succeed without an
      # Instantly key or Supabase config (the app renders its
      # "not connected" state and the login gate denies everyone).
      - name: Build
        run: npm run build
