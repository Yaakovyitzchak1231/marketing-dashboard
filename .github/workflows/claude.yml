name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install deps so Claude can actually run the checks instead of only
      # reading code. Without this the runner has no node_modules and every
      # test/lint invocation fails before it starts. Node version and cache
      # mirror the repo's own CI so results are comparable.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Pin the model: reviews are high-volume, so use the fast/cheap small model.
                      --allowedTools "Read,Write,Edit,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git rebase:*),Bash(git push:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(npm ci),Bash(npm run check),Bash(npm run build),Bash(npm test),Bash(npm run test:*),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run docs:check),Bash(npx tsc:*),Bash(npx vitest:*),Bash(npx eslint:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh pr checks:*)"
          # checks. It defaults to read-only tools plus git add/commit, so without
          # this list it cannot run tests and will (correctly) say so in its review.
          claude_args: |
            --model claude-haiku-5-5
            --allowedTools "Bash(npm ci),Bash(npm test),Bash(npm run test:*),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run docs:check),Bash(npx vitest:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep,LS"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
